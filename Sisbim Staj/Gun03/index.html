<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Maestro - Yönetim Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sol Menü -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>Mini Maestro</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active">Ana Sayfa</a></li>
                <li><a href="#">Müşteriler</a></li>
                <li><a href="#">Projeler</a></li>
                <li><a href="#">Ayarlar</a></li>
            </ul>
        </aside>

        <!--Üst Başlık ve İçerik -->
        <div class="main-wrapper">
            <!-- Header -->
            <header class="top-header">
                <h3>Müşteri Yönetimi</h3>
            </header>

            <!-- Ana İçerik Alanı -->
            <main class="content-area">
                
                <!-- İstatistik Kartları -->
                <div class="cards-grid">
                    <div class="card">
                        <h4>Toplam Müşteri</h4>
                        <p class="card-number">12</p>
                    </div>
                    <div class="card">
                        <h4>Aktif Projeler</h4>
                        <p class="card-number">5</p>
                    </div>
                    <div class="card">
                        <h4>Tamamlanan Görevler</h4>
                        <p class="card-number">28</p>
                    </div>
                </div>

                <!-- Form Bölümü -->
                <section class="form-section">
                    <h2>Yeni Müşteri Ekle</h2>
                    <form class="customer-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firmaAdi">Firma Adı</label>
                                <input type="text" id="firmaAdi" name="firmaAdi" required placeholder="Firma adını giriniz...">
                            </div>
                            <div class="form-group">
                                <label for="yetkili">Yetkili Kişi</label>
                                <input type="text" id="yetkili" name="yetkili" required placeholder="Ad Soyad...">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="eposta">E-posta</label>
                                <input type="email" id="eposta" name="eposta" placeholder="ornek@firma.com">
                            </div>
                            <div class="form-group">
                                <label for="telefon">Telefon</label>
                                <input type="tel" id="telefon" name="telefon" placeholder="05XX XXX XX XX">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="aciklama">Açıklama / Notlar</label>
                            <textarea id="aciklama" name="aciklama" rows="3" placeholder="Proje detayları..."></textarea>
                        </div>

                        <button type="submit" class="btn-submit">Müşteriyi Kaydet</button>
                    </form>
                </section>

            </main>
        </div>
    </div>

</body>
</html>
