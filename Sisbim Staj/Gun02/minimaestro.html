<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Maestro - Müşteri Yönetimi</title>
    <link rel="stylesheet" href="style.css"> <!-- Harici CSS dosyası -->
</head>
<body>

    <!-- Üst Başlık ve Menü -->
    <header class="main-header">
        <div class="container">
            <h1 class="logo">Mini Maestro</h1>
            <nav class="main-nav">
                <a href="#anasayfa">Ana Sayfa</a>
                <a href="#musteriler">Müşteriler</a>
                <a href="#projeler">Projeler</a>
            </nav>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="container main-content">
        <section class="form-section">
            <h2>Yeni Müşteri Ekle</h2>
            
            <form class="customer-form">
                <div class="form-group">
                    <label for="firmaAdi">Firma Adı</label>
                    <input type="text" id="firmaAdi" name="firmaAdi" required placeholder="Firma adını giriniz...">
                </div>

                <div class="form-group">
                    <label for="yetkili">Yetkili Kişi</label>
                    <input type="text" id="yetkili" name="yetkili" required placeholder="Ad Soyad...">
                </div>

                <div class="form-group">
                    <label for="eposta">E-posta</label>
                    <input type="email" id="eposta" name="eposta" placeholder="ornek@firma.com">
                </div>

                <div class="form-group">
                    <label for="telefon">Telefon</label>
                    <input type="tel" id="telefon" name="telefon" placeholder="05XX XXX XX XX">
                </div>

                <div class="form-group">
                    <label for="aciklama">Açıklama / Notlar</label>
                    <textarea id="aciklama" name="aciklama" rows="4" placeholder="Proje detayları..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Müşteriyi Kaydet</button>
            </form>
        </section>
    </main>

</body>
</html>
